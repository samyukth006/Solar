<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>&#183;</title>
<style>html,body{margin:0;height:100%;background:#02030a;overflow:hidden}canvas{display:block;touch-action:none}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const R=Math.random,TAU=Math.PI*2,T=60,T2=120,C=h=>new THREE.Color(h);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);const dom=ren.domElement;dom.style.touchAction='none';
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,6000);cam.position.set(0,60,135);
const clock=new THREE.Clock(),UP=new THREE.Vector3(0,1,0);
const uT={value:0};

/* glow sprite texture */
function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
r.addColorStop(0,'#fff');r.addColorStop(.25,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
const GT=glowTex();

/* twilight backdrop */
const bg=new THREE.Mesh(new THREE.SphereGeometry(4000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'varying vec3 v;void main(){float h=v.y*.5+.5;vec3 c=mix(vec3(.06,.012,.1),vec3(.004,.008,.03),smoothstep(.25,.9,h));c+=vec3(.12,.02,.17)*exp(-abs(v.y+.05)*7.)*.7;c+=vec3(0.,.05,.1)*pow(max(v.x,0.),4.)*.4;gl_FragColor=vec4(c,1.);}'}));
bg.renderOrder=-10;scene.add(bg);

/* starfields + dust (parallax layers) */
function pts(n,rad,size,k,cols,shell,op){const p=new Float32Array(n*3),c=new Float32Array(n*3);
for(let i=0;i<n;i++){const u=R()*2-1,a=R()*TAU,s=Math.sqrt(1-u*u),r=shell?rad*(.75+.25*R()):rad*Math.cbrt(R());
p.set([r*s*Math.cos(a),r*u,r*s*Math.sin(a)],i*3);const col=C(cols[i%cols.length]).multiplyScalar(.35+.65*R());c.set([col.r,col.g,col.b],i*3)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
const o=new THREE.Points(g,new THREE.PointsMaterial({size,map:GT,vertexColors:true,transparent:true,opacity:op||1,blending:THREE.AdditiveBlending,depthWrite:false}));
o.userData.k=k;scene.add(o);return o}
const SW=['#ffffff','#9fd8ff','#d9b3ff','#ffd0f0'];
const LAY=[pts(1800,2800,9,.98,SW,1),pts(900,1800,10,.9,SW,1),pts(450,1000,9,.72,SW,1),pts(1500,260,.7,0,['#8a3dff','#00e5ff','#ff2bd6'],0,.55)];

/* sun */
const SNOISE=`vec3 m3(vec3 x){return x-floor(x*(1./289.))*289.;}vec4 m4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 pm(vec4 x){return m4(((x*34.)+1.)*x);}
float snoise(vec3 v){const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;i=m3(i);
vec4 p=pm(pm(pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
vec3 ns=.142857142857*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));
vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
vec4 nm=1.79284291400159-.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;
vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}`;
const sunMat=new THREE.ShaderMaterial({uniforms:{t:uT},
vertexShader:SNOISE+`uniform float t;varying vec3 vP;varying vec3 vN;varying float vD;
void main(){vP=position;vN=normalize(normalMatrix*normal);vec3 n=normalize(position);
float f=snoise(n*2.2+vec3(0.,t*.35,t*.2));vD=max(0.,f-.3);
float burst=pow(max(0.,snoise(n*1.1+vec3(t*.12,0.,t*.09))),3.)*2.2;
gl_Position=projectionMatrix*modelViewMatrix*vec4(position+normal*(vD*.9+burst),1.);}`,
fragmentShader:SNOISE+`uniform float t;varying vec3 vP;varying vec3 vN;varying float vD;
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*snoise(p);p=p*2.03+7.1;a*=.5;}return s;}
void main(){vec3 p=normalize(vP)*3.;float w=fbm(p+vec3(0.,t*.12,0.));float g=fbm(p*2.5+w*1.5+t*.2);
float cell=1.-abs(snoise(p*4.+t*.3));float h=clamp(.55+g*.7+cell*cell*.5+vD*1.4,0.,1.7);
vec3 c=mix(vec3(.35,.02,0.),vec3(1.,.35,.02),smoothstep(.2,.7,h));c=mix(c,vec3(1.,.85,.35),smoothstep(.7,1.1,h));c=mix(c,vec3(1.,.97,.9),smoothstep(1.2,1.7,h));
float fr=1.-max(dot(normalize(vN),vec3(0.,0.,1.)),0.);float pu=.5+.5*sin(t*1.7);
vec3 ch=mix(vec3(1.,.1,.5),vec3(.1,.8,1.),pu);c=c*(1.-.35*fr)+ch*pow(fr,3.)*(.5+.6*pu);gl_FragColor=vec4(c,1.);}`});
const sun=new THREE.Mesh(new THREE.SphereGeometry(8,96,64),sunMat);scene.add(sun);
const corona=new THREE.Mesh(new THREE.SphereGeometry(11.6,48,32),new THREE.ShaderMaterial({uniforms:{t:uT},side:THREE.BackSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,
vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform float t;varying vec3 vN;void main(){float i=pow(max(.66-dot(vN,vec3(0.,0.,1.)),0.),2.4)*2.2;float pu=.5+.5*sin(t*1.7);vec3 c=mix(vec3(1.,.35,.1),mix(vec3(1.,.1,.6),vec3(.1,.8,1.),pu),.45);gl_FragColor=vec4(c*i*(.8+.4*pu),i);}'}));
scene.add(corona);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:0xff6a1a,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.7}));halo.scale.set(70,70,1);scene.add(halo);
scene.add(new THREE.PointLight(0xffe2b8,1.9,0,1),new THREE.AmbientLight(0x1b2250,.7));

/* planets */
const PD=[[1,14,40,'#8a8178','#4a443e'],[1.6,20,52,'#e0a868','#7a4a22'],[1.7,27,66,'#2a6bd6','#0e2a5e'],[1.3,34,80,'#c24e2e','#4d1a10'],[3.6,46,110,'#d8b48a','#7a5a3a'],[3,62,140,'#e6cf9a','#8a6f3c'],[2.2,78,170,'#6fd0e0','#1c5a78'],[2.1,92,200,'#3b4fe0','#141a6a']];
function tex(a,b,n){const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d'),A=C(a),B=C(b);
for(let y=0;y<128;y++){const m=.5+.5*Math.sin(y*n*.2+Math.sin(y*.37)*2);g.fillStyle='#'+A.clone().lerp(B,m).getHexString();g.fillRect(0,y,256,1)}
for(let i=0;i<220;i++){g.fillStyle='rgba(0,0,0,'+R()*.14+')';g.beginPath();g.ellipse(R()*256,R()*128,R()*14+2,R()*3+1,0,0,TAU);g.fill()}
return new THREE.CanvasTexture(c)}
function shell(r,col){return new THREE.Mesh(new THREE.SphereGeometry(r,32,24),new THREE.ShaderMaterial({side:THREE.BackSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,uniforms:{c:{value:C(col)}},
vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform vec3 c;varying vec3 vN;void main(){float i=pow(max(.7-dot(vN,vec3(0.,0.,1.)),0.),2.);gl_FragColor=vec4(c*i*1.6,i);}'}))}
const PS=[],targets=[sun];
PD.forEach((d,i)=>{const [r,dist,per,c1,c2]=d,g=new THREE.Group(),m=new THREE.Mesh(new THREE.SphereGeometry(r,48,32),new THREE.MeshStandardMaterial({map:tex(c1,c2,3+i*1.3),roughness:.85,metalness:.05,emissive:C(c2),emissiveIntensity:.12}));
m.rotation.z=(R()-.5)*.5;m.userData={base:.15+R()*.5,vel:0};m.userData.vel=m.userData.base;g.add(m,shell(r*1.14,i==2?'#2d8cff':i==3?'#ff4a2a':'#8a5cff'));scene.add(g);
const o=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(Array.from({length:160},(_,k)=>new THREE.Vector3(Math.cos(k/160*TAU)*dist,0,Math.sin(k/160*TAU)*dist))),new THREE.LineBasicMaterial({color:0x3a4a8a,transparent:true,opacity:.22}));scene.add(o);
const p={g,m,r,d:dist,per,ph:R()*TAU};targets.push(m);
if(i==4){const gr=new THREE.Group(),rg=new THREE.RingGeometry(r*1.5,r*2.5,128),uv=rg.attributes.uv,ps=rg.attributes.position;
for(let k=0;k<ps.count;k++)uv.setXY(k,(Math.hypot(ps.getX(k),ps.getY(k))-r*1.5)/(r),0);
const cv=document.createElement('canvas');cv.width=256;cv.height=2;const x=cv.getContext('2d');for(let k=0;k<256;k++){const a=Math.max(0,Math.sin(k*.35)*.5+Math.sin(k*.11)*.4+.25);x.fillStyle='rgba(230,205,160,'+Math.min(a,.9)+')';x.fillRect(k,0,1,2)}
const ring=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),side:THREE.DoubleSide,transparent:true,depthWrite:false}));
ring.rotation.x=Math.PI/2;gr.rotation.z=.42;gr.rotation.x=.12;gr.add(ring);g.add(gr);p.ring=ring}
if(i==2){const mo=new THREE.Mesh(new THREE.IcosahedronGeometry(.35,0),new THREE.MeshBasicMaterial({color:0x00ffd0,wireframe:true}));g.add(mo);p.ghost=mo} /* egg: retrograde ghost moon */
PS.push(p)});

/* rogue asteroids (closed Lissajous loops) */
const AS=[],amat=new THREE.MeshStandardMaterial({color:0x2a2a3a,roughness:.9,flatShading:true,emissive:0x0a0618});
for(let i=0;i<48;i++){const g=new THREE.IcosahedronGeometry(1,0),ps=g.attributes.position,v=new THREE.Vector3();
for(let k=0;k<ps.count;k++){v.fromBufferAttribute(ps,k);const h=Math.abs(Math.sin(v.x*12.9898+v.y*78.233+v.z*37.719)*43758.5453)%1;v.multiplyScalar(.6+.7*h);ps.setXYZ(k,v.x,v.y,v.z)}
g.computeVertexNormals();const m=new THREE.Mesh(g,amat);m.scale.setScalar(.25+R()*.9);scene.add(m);
const a=R()*TAU,u=R()*2-1,rr=30+R()*70,s=Math.sqrt(1-u*u),ri=()=>1+Math.floor(R()*3);
AS.push({m,c:new THREE.Vector3(rr*s*Math.cos(a),rr*u*.5,rr*s*Math.sin(a)),A:new THREE.Vector3(4+R()*12,3+R()*8,4+R()*12),n:[ri(),ri(),ri()],f:[R()*TAU,R()*TAU,R()*TAU],r:[ri(),ri(),ri()]})}

/* UFOs + lasers */
const NEON=[0x00e5ff,0xff2bd6,0x7dff3a,0xffa21a],SH=[],lp=[new THREE.Vector2(0,0),new THREE.Vector2(1.4,0),new THREE.Vector2(1.9,.18),new THREE.Vector2(1.3,.34),new THREE.Vector2(.7,.5),new THREE.Vector2(0,.55)];
const SA=[[1,2,1],[2,1,3],[1,3,2],[3,1,1]],SR=[55,72,42,88],SP=[3,4,5,6];
NEON.forEach((col,i)=>{const g=new THREE.Group(),in_=new THREE.Group();
in_.add(new THREE.Mesh(new THREE.LatheGeometry(lp,28),new THREE.MeshStandardMaterial({color:0x07070d,metalness:.9,roughness:.25,emissive:col,emissiveIntensity:.18})),
new THREE.Mesh(new THREE.SphereGeometry(.7,16,10,0,TAU,0,Math.PI/2),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.55})),
(()=>{const t=new THREE.Mesh(new THREE.TorusGeometry(1.5,.05,6,32),new THREE.MeshBasicMaterial({color:col}));t.rotation.x=Math.PI/2;t.position.y=.14;return t})());
in_.children[1].position.y=.45;g.add(in_);g.scale.setScalar(1.5);scene.add(g);
const bolt=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,5,6),new THREE.MeshBasicMaterial({color:col,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));bolt.visible=false;scene.add(bolt);
SH.push({g,in_,bolt,pos:new THREE.Vector3(),ph:[R()*TAU,R()*TAU,R()*TAU],off:R()*12,roll:0})});
function shipAt(i,t,o){const s=SH[i],a=SA[i],r=SR[i];return o.set(r*Math.sin(TAU*a[0]*t/T+s.ph[0]),r*.22*Math.sin(TAU*a[1]*t/T+s.ph[1]),r*Math.cos(TAU*a[2]*t/T+s.ph[2]))}

/* monoliths + electricity */
const MO=[],MC=[0x00e5ff,0xb400ff,0xff2bd6,0x39ff88];
for(let i=0;i<9;i++){const col=MC[i%4],g=new THREE.Group(),w=1.2+R()*1.2,h=5+R()*6,geo=new THREE.BoxGeometry(w,h,w*.55);
const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x04040a,metalness:.95,roughness:.12,emissive:col,emissiveIntensity:.12}));
g.add(m,new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.85})));
const a=i/9*TAU+R()*.4,r=105+R()*50;g.position.set(Math.cos(a)*r,(R()-.5)*50,Math.sin(a)*r);g.userData={m,a,r,y:g.position.y,ph:R()*TAU,sp:(R()<.5?-1:1)*(.2+R()*.3)};scene.add(g);MO.push(g)}
const LN=[0,1].map(()=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(18*3),3));
const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xa8f6ff,transparent:true,blending:THREE.AdditiveBlending}));l.visible=false;l.frustumCulled=false;scene.add(l);return l});
function zap(l,a,b){const p=l.geometry.attributes.position;for(let i=0;i<18;i++){const f=i/17,j=i>0&&i<17?5:0;p.setXYZ(i,a.x+(b.x-a.x)*f+(R()-.5)*j,a.y+(b.y-a.y)*f+(R()-.5)*j,a.z+(b.z-a.z)*f+(R()-.5)*j)}p.needsUpdate=true}
let zEnd=0,zNext=2,zA=0,zB=1,flash=0;

/* easter eggs: watcher eye in the far void, sun-triple-tap shockwave */
const eye=new THREE.Group(),eM=[];eye.position.set(-1100,300,-1300);
[[140,0x14081f,0],[60,0xff2bd6,139],[26,0x000000,140]].forEach((d,i)=>{const m=new THREE.Mesh(i?new THREE.CircleGeometry(d[0],48):new THREE.SphereGeometry(d[0],32,24),new THREE.MeshBasicMaterial({color:d[1],transparent:true,opacity:0,depthWrite:false}));m.position.z=d[2];eye.add(m);eM.push(m)});scene.add(eye);
const wave=new THREE.Mesh(new THREE.RingGeometry(.96,1,96),new THREE.MeshBasicMaterial({color:0x7ff0ff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));wave.visible=false;scene.add(wave);let wT=-9;

/* interaction: planet drag-spin (registered before OrbitControls so it wins) */
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let drag=null,lx=0,lt=0,taps=[];
dom.addEventListener('pointerdown',e=>{mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(targets)[0];if(!h)return;
if(h.object===sun){const n=performance.now();taps=taps.filter(x=>n-x<1500);taps.push(n);if(taps.length>=3){taps=[];wT=clock.elapsedTime;flash=1}return}
drag=h.object;ctrl.enabled=false;lx=e.clientX;lt=performance.now()});
addEventListener('pointermove',e=>{if(!drag)return;const n=performance.now(),dt=Math.max((n-lt)/1000,.008),r=(e.clientX-lx)*.012;drag.rotation.y+=r;drag.userData.vel=THREE.MathUtils.clamp(r/dt,-30,30);lx=e.clientX;lt=n});
const up=()=>{if(drag){ctrl.enabled=true;drag=null}};addEventListener('pointerup',up);addEventListener('pointercancel',up);
const ctrl=new THREE.OrbitControls(cam,dom);ctrl.enableDamping=true;ctrl.dampingFactor=.06;ctrl.minDistance=14;ctrl.maxDistance=420;ctrl.rotateSpeed=.7;ctrl.zoomSpeed=.8;ctrl.enablePan=false;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

/* loop */
const v1=new THREE.Vector3(),v2=new THREE.Vector3(),v3=new THREE.Vector3(),v0=new THREE.Vector3(),dir=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;uT.value=t;
bg.position.copy(cam.position);
LAY.forEach((l,i)=>{l.position.copy(cam.position).multiplyScalar(l.userData.k);l.rotation.y=t*.003*(i+1)});
halo.material.opacity=.6+.12*Math.sin(t*1.7);
PS.forEach(p=>{const a=TAU*t/p.per+p.ph;p.g.position.set(Math.cos(a)*p.d,Math.sin(a*3+p.ph)*(.8+p.r*.3),Math.sin(a)*p.d);
const m=p.m,u=m.userData;if(drag!==m){m.rotation.y+=u.vel*dt;u.vel+=(u.base-u.vel)*(1-Math.exp(-1.6*dt))}else u.vel*=Math.pow(.05,dt);
if(p.ring)p.ring.rotation.z+=dt*.25;if(p.ghost)p.ghost.position.set(Math.cos(-t*1.1)*3.4,Math.sin(t*2.2)*.5,Math.sin(-t*1.1)*3.4)});
const w=TAU*t/T2;AS.forEach(s=>{const A=s.A,c=s.c,f=s.f,n=s.n;s.m.position.set(c.x+A.x*Math.sin(w*n[0]+f[0]),c.y+A.y*Math.sin(w*n[1]+f[1]),c.z+A.z*Math.sin(w*n[2]+f[2]));
s.m.rotation.set(w*s.r[0]+f[0],w*s.r[1]+f[1],w*s.r[2]+f[2])});
SH.forEach((s,i)=>{shipAt(i,t,s.pos);s.g.position.copy(s.pos);shipAt(i,t-.1,v0);shipAt(i,t+.1,v1);v2.subVectors(s.pos,v0);v3.subVectors(v1,s.pos);
const turn=(v2.x*v3.z-v2.z*v3.x)/(v2.length()*v3.length()+1e-6);s.roll+=((-turn*40)-s.roll)*.1;
s.g.rotation.y=Math.atan2(v3.x,v3.z);s.in_.rotation.z=THREE.MathUtils.clamp(s.roll,-.7,.7);s.in_.rotation.x=v3.y*.8;s.in_.rotation.y=t*3;
const P=SP[i],ph=((t+s.off)%P)/P,tg=SH[(i+1)%4];
if(ph<.35){const f=ph/.35;dir.subVectors(tg.pos,s.pos);const L=dir.length();dir.normalize();s.bolt.visible=true;s.bolt.position.copy(s.pos).addScaledVector(dir,2+(L-4)*f);s.bolt.quaternion.setFromUnitVectors(UP,dir);s.bolt.material.opacity=1-f*.4}else s.bolt.visible=false});
flash*=Math.pow(.2,dt);
MO.forEach(g=>{const u=g.userData,a=u.a+t*.01*u.sp;g.position.set(Math.cos(a)*u.r,u.y+Math.sin(t*.5+u.ph)*2.2,Math.sin(a)*u.r);g.rotation.y=t*u.sp;g.rotation.x=Math.sin(t*.3+u.ph)*.15;u.m.material.emissiveIntensity=.12+.1*Math.sin(t*1.3+u.ph)+flash*1.5});
if(t>zNext){zA=Math.floor(R()*MO.length);zB=(zA+1+Math.floor(R()*(MO.length-1)))%MO.length;zEnd=t+.35;zNext=t+1.5+R()*3}
LN.forEach((l,i)=>{if(t<zEnd){l.visible=R()>.25;if(l.visible)zap(l,MO[zA].position,i?sun.position:MO[zB].position)}else l.visible=false});
