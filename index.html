<script>

/* glow sprite texture */

/* starfields + dust (parallax layers) */

p.set([r*s*Math.cos(a),r*u,r*s*Math.sin(a)],i*3);const col=C(cols[i%cols.length]).multiplyScalar(.35+.65*R());c.set([col.r,col.g,col.b],i*3)}

/* sun */

vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);

vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));

vec4 nm=1.79284291400159-.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;

ring.rotation.x=Math.PI/2;gr.rotation.z=.42;gr.rotation.x=.12;gr.add(ring);g.add(gr);p.ring=ring}
if(i==2){const mo=new THREE.Mesh(new THREE.IcosahedronGeometry(.18,0),new THREE.MeshBasicMaterial({color:0x1fd1c1,wireframe:true}));g.add(mo);p.ghost=mo} /* egg: retrograde ghost moon */

/* rogue asteroids: multi-octave rock, craters, vertex tones, closed Lissajous loops */
const AS=[],amat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:.1,flatShading:true});
const nz=(x,y,z)=>Math.sin(x*1.3+Math.sin(y*1.7+z))*Math.sin(y*1.1+Math.sin(z*1.9+x))*Math.cos(z*1.5+Math.sin(x*2.1+y));
for(let i=0;i<85;i++){const g=new THREE.IcosahedronGeometry(1,3),ps=g.attributes.position,v=new THREE.Vector3(),sd=R()*50,col=new Float32Array(ps.count*3),tone=new THREE.Color().setHSL(.05+R()*.1,.12+R()*.2,.28+R()*.12),
cr=Array.from({length:6},()=>new THREE.Vector3(R()-.5,R()-.5,R()-.5).normalize()),el=new THREE.Vector3(.7+R()*.6,.6+R()*.5,.7+R()*.6);
for(let k=0;k<ps.count;k++){v.fromBufferAttribute(ps,k).normalize();const x=v.x+sd,y=v.y+sd,z=v.z+sd;
let r=1+.3*nz(x*1.5,y*1.5,z*1.5)+.15*nz(x*3.7,y*3.7,z*3.7)+.06*nz(x*9,y*9,z*9),dk=0;
for(const c of cr){const a=Math.acos(Math.min(1,v.dot(c)));if(a<.5){const d=Math.pow(1-a/.5,.6);r-=.2*d;dk+=d}}

col.set([tone.r*mm,tone.g*mm,tone.b*mm],k*3);v.multiplyScalar(r).multiply(el);ps.setXYZ(k,v.x,v.y,v.z)}
g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
const m=new THREE.Mesh(g,amat);m.scale.setScalar(.2+R()*R()*1.5);scene.add(m);
const a=R()*TAU,u=R()*2-1,rr=40+R()*170,s=Math.sqrt(1-u*u),ri=()=>1+Math.floor(R()*3);
AS.push({m,c:new THREE.Vector3(rr*s*Math.cos(a),rr*u*.5,rr*s*Math.sin(a)),A:new THREE.Vector3(8+R()*26,6+R()*16,8+R()*26),n:[ri(),ri(),ri()],f:[R()*TAU,R()*TAU,R()*TAU],r:[ri()*2,ri()*2,ri()*2]})}

/* fleet: duelling saucers, skyships, scouts + portal */
const NEON=[0x1fd1c1,0xd1204a,0x8a6bff,0xe39b2a],SH=[],ss=(x,a,b)=>THREE.MathUtils.smoothstep(x,a,b);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.9,roughness:.3,side:2},o)),B=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o));
const AD={transparent:true,blending:THREE.AdditiveBlending,depthWrite:false};
const gl=(c,s)=>{const p=new THREE.Sprite(new THREE.SpriteMaterial(Object.assign({map:GT,color:c},AD)));p.scale.set(s,s,1);return p};
const hullP=[[0,.05],[.9,0],[1.5,.08],[2.1,.22],[2.3,.34],[1.9,.5],[1.2,.62],[.8,.78],[0,.8]].map(a=>new THREE.Vector2(a[0],a[1]));

for(let k=0;k<16;k++){const a=k/16*TAU,l=new THREE.Mesh(new THREE.SphereGeometry(.08,8,6),B(k%2?0xffffff:col));l.position.set(Math.cos(a)*2.3,.34,Math.sin(a)*2.3);sp.add(l)}
s.add(sp);const core=new THREE.Mesh(new THREE.CircleGeometry(.85,24),B(col,AD));core.rotation.x=Math.PI/2;core.position.y=-.01;s.add(core);
const dome=new THREE.Mesh(new THREE.SphereGeometry(.78,20,12,0,TAU,0,Math.PI/2),B(col,{transparent:true,opacity:.35,side:2,depthWrite:false}));dome.position.y=.76;s.add(dome);
const orb=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),B(0xffffff));orb.position.y=.95;const gg=gl(col,3.2);gg.position.y=.9;s.add(orb,gg);
const an=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1,5),B(0xcccccc));an.position.y=1.5;const tp=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),B(col));tp.position.y=2;s.add(an,tp);
for(let k=0;k<3;k++){const a=k/3*TAU,p=new THREE.Mesh(new THREE.CylinderGeometry(.06,.04,.5,6),M(0x222230)),f=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.04,10),M(0x222230));p.position.set(Math.cos(a)*1.2,-.22,Math.sin(a)*1.2);f.position.set(Math.cos(a)*1.2,-.48,Math.sin(a)*1.2);s.add(p,f)}
const cn=new THREE.Mesh(new THREE.ConeGeometry(1.7,3.4,24,1,true),B(col,{transparent:true,opacity:.09,blending:THREE.AdditiveBlending,depthWrite:false,side:2}));cn.position.y=-1.7;s.add(cn);return{s,sp}}

bx(2.4,1.2,9,0,0,-.5);bx(1.8,.5,6,0,.85,-1,dk);bx(1.1,.4,3,0,1.25,-2.2);bx(2.7,.18,6.5,0,-.2,-.5,acc);

bx(1,1.5,1.2,0,2.1,-3.4);bx(1.5,.22,1.7,0,2.95,-3.4,acc);bx(1.02,.12,1.22,0,2.4,-3.4,B(0xe8c070));

function scout(col){const s=new THREE.Group(),sp=new THREE.Group();

const e=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,1.1,10),M(0x111118));e.rotation.x=Math.PI/2;e.position.set(d*.75,0,-1.4);s.add(e);const f=gl(col,1.8);f.position.set(d*.75,0,-2.1);s.add(f);

const SA=[[1,2,1],[2,1,3],[1,3,2],[3,1,1],[1,1,1]],SR=[85,110,65,135,0],SB=[1,1,1,1,1],SP=[3,4,5,6],SS=[.6,.6,.6,.6,1.1];
const MK=[...NEON.map(c=>()=>saucer(c)),()=>flagship()];

fragmentShader:'uniform float t;varying vec2 u;void main(){vec2 p=u*2.-1.;float r=length(p);if(r>1.)discard;float a=atan(p.y,p.x);float s=sin(a*4.+r*10.-t*4.)*.5+.5;vec3 c=mix(vec3(.3,.02,.55),vec3(.05,.75,.7),s);float e=smoothstep(1.,.75,r);gl_FragColor=vec4(c*(.3+s)*e*(1.6-r),e);}'});

const p0=new THREE.Vector3(),p1=new THREE.Vector3();shipAt(0,tc,p0);shipAt(0,tc+.1,p1);g.position.copy(p0);g.lookAt(p1);g.visible=false;scene.add(g);return{g,m}});

/* monoliths + surreal */
const MO=[],MC=[0x1fd1c1,0x6a4cff,0xd1204a,0xe39b2a];
for(let i=0;i<9;i++){const col=MC[i%4],g=new THREE.Group(),w=1.2+R()*1.2,h=5+R()*6,geo=new THREE.BoxGeometry(w,h,w*.55);
const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x04040a,metalness:.95,roughness:.12,emissive:col,emissiveIntensity:.12}));

const ST3=[];for(let i=0;i<40;i++){const g=new THREE.Group(),col=SW[i%4];[[0,0],[0,Math.PI/2],[Math.PI/2,0]].forEach(r=>{const m=new THREE.Mesh(new THREE.OctahedronGeometry(1),B(col));m.scale.set(.2,2,.2);m.rotation.set(r[0],0,r[1]);g.add(m)});
g.add(gl(col,7));const a=R()*TAU,u=R()*2-1,s=Math.sqrt(1-u*u),r=200+R()*600,z=1.5+R()*4;g.position.set(r*s*Math.cos(a),r*u,r*s*Math.sin(a));g.userData={s:.2+R()*.5,z,ph:R()*TAU};g.scale.setScalar(z);scene.add(g);ST3.push(g)}

const MD={2:[[.38,3.4,1.6,'#b8b8c0']],3:[[.16,1.8,4,'#7a6a60'],[.12,2.6,3,'#6a5a52']],4:[[.5,9,1.4,'#c9b08a'],[.45,12,1,'#8a7a6a'],[.7,16,.7,'#d8d0c0'],[.6,21,.5,'#6a5a58']],5:[[.7,15,.8,'#d8c8a8'],[.35,19,.5,'#b0a090']],7:[[.5,6,-.9,'#b0b8d0']]};
PS.forEach((p,i)=>{p.moons=(MD[i]||[]).map(d=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(d[0],1),new THREE.MeshStandardMaterial({color:d[3],roughness:1,flatShading:true}));p.g.add(m);return{m,d:d[1],s:d[2],ph:R()*TAU}})});
const CM=[[110,50,.75,.5,0x9fe8e0],[170,60,.8,-.7,0xc9a8ff]].map(d=>{const g=new THREE.Group(),n=new THREE.Mesh(new THREE.IcosahedronGeometry(.9,1),new THREE.MeshStandardMaterial({color:0x8a8a96,roughness:1,flatShading:true})),tl=Array.from({length:24},()=>{const p=gl(d[4],1);scene.add(p);return p});g.add(n,gl(d[4],9));scene.add(g);return{g,P:d[0],p:d[1],e:d[2],inc:d[3],tl}});
const SSH=[7,11,13].map((P,k)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(1,.1,160,5),B(0xe8e0ff,AD));m.visible=false;scene.add(m);return{m,P,k,off:k*3.3}});
const gc=document.createElement('canvas');gc.width=gc.height=256;const gx=gc.getContext('2d');
for(let i=0;i<2600;i++){const a=R()*5*Math.PI,r=a*7+R()*14-7,arm=(i%2)*Math.PI,x=128+Math.cos(a+arm)*r,y=128+Math.sin(a+arm)*r*.45;gx.fillStyle='rgba('+(150+R()*100|0)+','+(120+R()*80|0)+',255,'+R()*.7+')';gx.fillRect(x,y,1.6,1.6)}

/* easter eggs: watcher eye in the far void, sun-triple-tap shockwave */

[[180,0x14081f,0],[76,0xb01040,178],[33,0x000000,179]].forEach((d,i)=>{const m=new THREE.Mesh(i?new THREE.CircleGeometry(d[0],48):new THREE.SphereGeometry(d[0],32,24),new THREE.MeshBasicMaterial({color:d[1],transparent:true,opacity:0,depthWrite:false}));m.position.z=d[2];eye.add(m);eM.push(m)});scene.add(eye);
const wave=new THREE.Mesh(new THREE.RingGeometry(.96,1,96),new THREE.MeshBasicMaterial({color:0x5be0d0,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));wave.visible=false;scene.add(wave);let wT=-9;

/* interaction: planet drag-spin (registered before OrbitControls so it wins) */

dom.addEventListener('pointerdown',e=>{mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(targets)[0];if(!h)return;

/* loop */

function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;uT.value=t;

const m=p.m,u=m.userData;if(drag!==m){m.rotation.y+=u.vel*dt;u.vel+=(u.base-u.vel)*(1-Math.exp(-1.6*dt))}else u.vel*=Math.pow(.05,dt);
if(p.ring)p.ring.rotation.z+=dt*.25;p.moons.forEach(q=>{const a=q.ph+t*q.s;q.m.position.set(Math.cos(a)*q.d,Math.sin(a)*q.d*.12,Math.sin(a)*q.d)});if(p.ghost)p.ghost.position.set(Math.cos(-t*1.1)*5.2,Math.sin(t*2.2)*.3,Math.sin(-t*1.1)*5.2)});
const w=TAU*t/T2;AS.forEach(s=>{const A=s.A,c=s.c,f=s.f,n=s.n;s.m.position.set(c.x+A.x*Math.sin(w*n[0]+f[0]),c.y+A.y*Math.sin(w*n[1]+f[1]),c.z+A.z*Math.sin(w*n[2]+f[2]));
s.m.rotation.set(w*s.r[0]+f[0],w*s.r[1]+f[1],w*s.r[2]+f[2])});
const tm=t%T;
SH.forEach((s,i)=>{shipAt(i,t,s.pos);s.g.position.copy(s.pos);shipAt(i,t-.1,v0);shipAt(i,t+.1,v1);v2.subVectors(s.pos,v0);v3.subVectors(v1,s.pos);
const turn=(v2.x*v3.z-v2.z*v3.x)/(v2.length()*v3.length()+1e-6);s.roll+=((-turn*40)-s.roll)*.1;
s.g.rotation.y=Math.atan2(v3.x,v3.z);s.in_.rotation.z=THREE.MathUtils.clamp(s.roll,-.7,.7);s.in_.rotation.x=-v3.y*.8;s.sp.rotation[s.ax]=t*s.spd;
let sc=1;if(i==0)sc=tm<44?1-ss(tm,39.5,40.5):ss(tm,47.5,48.5);
s.g.visible=sc>.02;s.g.scale.setScalar(SS[i]*Math.max(sc,.001));

if(ph<.35&&sc>.5&&tg.g.visible){const f=ph/.35;dir.subVectors(tg.pos,s.pos);const L=dir.length();dir.normalize();s.bolt.visible=true;s.bolt.position.copy(s.pos).addScaledVector(dir,1.2+(L-2.4)*f);s.bolt.quaternion.setFromUnitVectors(UP,dir);s.bolt.material.opacity=1-f*.4}else s.bolt.visible=false}});
PT.forEach((p,k)=>{const f=k?ss(tm,45,47)*(1-ss(tm,49,51)):ss(tm,36,38.5)*(1-ss(tm,40.8,42.5));p.g.visible=f>.01;p.g.scale.setScalar(Math.max(f,.001)*5);p.m.uniforms.t.value=t});
flash*=Math.pow(.2,dt);
MO.forEach(g=>{const u=g.userData,a=u.a+t*.01*u.sp;g.position.set(Math.cos(a)*u.r,u.y+Math.sin(t*.5+u.ph)*2.2,Math.sin(a)*u.r);g.rotation.y=t*u.sp;g.rotation.x=Math.sin(t*.3+u.ph)*.15;u.m.material.emissiveIntensity=.12+.1*Math.sin(t*1.3+u.ph)+flash*1.5});
ISL.forEach(g=>{const u=g.userData;g.position.y=u.y+Math.sin(t*.4+u.ph)*3;g.rotation.y=t*.08*u.d});
const rp=rain.geometry.attributes.position;for(let i=0;i<rp.count;i++)rp.setY(i,((rain.userData.y[i]+t*14)%420)-160);rp.needsUpdate=true;
ST3.forEach(g=>{const u=g.userData;g.rotation.y=t*u.s;g.rotation.x=t*u.s*.6;g.scale.setScalar(u.z*(1+.18*Math.sin(t*2+u.ph)))});
const c2=t%90,cu=Math.min(Math.max((c2-10)/32,0),1),cv=c2>10&&c2<42;
crG.visible=cv;cpos(cu,crG.position);crG.scale.setScalar(.7*Math.max(ss(c2,10,12),.001));crG.rotation.set(t*1.7,t*3,t*2.3);
TR.forEach((p,i)=>{const u=cu-i*.012;p.visible=cv&&u>0;if(p.visible){cpos(u,p.position);p.scale.setScalar((i<14?8:14)*(1+i*.1)*(1-i/60));p.material.opacity=(1-i/36)*.85}});
const fv=(c2-42)/6;boom.visible=fv>0&&fv<1;if(boom.visible){boom.scale.setScalar(20+fv*200);boom.material.opacity=1-fv}
CM.forEach(c=>{const th=TAU*t/c.P,r=c.p/(1+c.e*Math.cos(th));c.g.position.set(r*Math.cos(th),r*Math.sin(th)*Math.sin(c.inc),r*Math.sin(th)*Math.cos(c.inc));c.g.rotation.y=t;
v0.copy(c.g.position).normalize();const L=Math.min(90,1500/(r+10));c.tl.forEach((s,k)=>{s.position.copy(c.g.position).addScaledVector(v0,k*L/24);s.scale.setScalar(7*(1-k/24)+1);s.material.opacity=.55*(1-k/24)})});
SSH.forEach(q=>{const x=t+q.off,ph=(x%q.P)/q.P,sd=Math.floor(x/q.P)+q.k*50,hs=n=>Math.abs(Math.sin(sd*12.9898+n*78.233)*43758.5453)%1;
q.m.visible=ph<.1;if(q.m.visible){const a=hs(1)*TAU,u=hs(2)*1.2-.2,s=Math.sqrt(1-u*u);v1.set(Math.cos(a)*s,u,Math.sin(a)*s);v2.set(hs(3)-.5,hs(4)-.5,hs(5)-.5);v3.crossVectors(v1,v2).normalize();q.m.position.copy(v1).multiplyScalar(900).addScaledVector(v3,ph/.1*600-300);q.m.quaternion.setFromUnitVectors(UP,v3)}});
const far=cam.position.length(),o=THREE.MathUtils.smoothstep(far,250,420);eM.forEach((m,i)=>m.material.opacity=o*(i?.9:.8));
eye.lookAt(cam.position);eye.scale.y=1-.92*Math.exp(-Math.pow(((t%12)-6)*5,2));
const wa=t-wT;if(wa<2.2){wave.visible=true;wave.scale.setScalar(11+wa*90);wave.material.opacity=1-wa/2.2;wave.lookAt(cam.position)}else wave.visible=false;
ctrl.update();ren.render(scene,cam)}
loop();
